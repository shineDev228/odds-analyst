[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# L'URL réelle est injectée par migrations/env.py depuis le fichier .env
sqlalchemy.url = postgresql+psycopg://odds_analyst_app:mot_de_passe@localhost:5432/odds_analyst

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
